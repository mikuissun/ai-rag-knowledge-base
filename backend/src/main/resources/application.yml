spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  application:
    name: knowledge-base
  profiles:
    default: dev

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  rag:
    chunk-size: ${RAG_CHUNK_SIZE:1000}
    chunk-overlap: ${RAG_CHUNK_OVERLAP:150}
    max-chunks-per-document: ${RAG_MAX_CHUNKS_PER_DOCUMENT:500}
  embedding:
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}
    dimension: ${DASHSCOPE_EMBEDDING_DIMENSION:1024}
    batch-size: ${DASHSCOPE_EMBEDDING_BATCH_SIZE:10}
    connect-timeout-seconds: ${DASHSCOPE_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${DASHSCOPE_READ_TIMEOUT_SECONDS:60}
  storage:
    base-path: ${STORAGE_BASE_PATH:./data/uploads}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
