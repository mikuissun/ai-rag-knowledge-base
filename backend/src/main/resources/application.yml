spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  application:
    name: knowledge-base
  profiles:
    default: dev

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  storage:
    base-path: ${STORAGE_BASE_PATH:./data/uploads}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
